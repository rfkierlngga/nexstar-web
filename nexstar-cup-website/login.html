<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#21072d">
  <title>Admin Login — Nexstar Cup</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin-body">
  <main class="auth-shell">
    <a href="index.html" class="back-home">← Kembali ke website</a>
    <section class="auth-card">
      <div class="auth-brand"><img src="assets/1.jpeg" alt="Logo Nexstar Cup" class="brand-logo"><span class="brand-name">NEXSTAR <small>CUP</small></span></div>
      <p class="eyebrow">RESTRICTED AREA</p>
      <h1>ADMIN <em>LOGIN.</em></h1>
      <p class="muted">Masuk untuk mengelola anggota dan konten Nexstar Cup.</p>
      <form id="login-form">
        <label for="email">Email admin</label><input id="email" type="email" autocomplete="username" placeholder="admin@email.com" required>
        <label for="password">Password</label><input id="password" type="password" autocomplete="current-password" placeholder="Masukkan password" required>
        <button class="button button-primary full-button" id="login-button" type="submit">Masuk ke Dashboard ↗</button>
        <p class="form-message" id="login-message" role="status"></p>
      </form>
      <div class="auth-note">Akses khusus pengelola yang telah diberi izin.</div>
    </section>
    <p class="auth-copyright">© <span id="year"></span> ACADEMIC HELPER</p>
  </main>
  <script type="module" src="js/auth.js"></script>
</body>
</html>
